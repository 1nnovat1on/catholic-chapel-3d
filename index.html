<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>St. Aurelius Chapel — 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:Georgia,serif}canvas{display:block}#veil{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:radial-gradient(circle,#263848aa,#05090ddd);text-align:center}#veil div{max-width:460px;padding:34px}h1{letter-spacing:.08em;font-weight:400;margin:0 0 12px}p{line-height:1.55;color:#dce9ef}button{border:1px solid #d6bd77;background:#6d5426;color:#fff;padding:14px 22px;font:600 15px Georgia;cursor:pointer;border-radius:2px}#note{position:fixed;bottom:15px;left:16px;z-index:2;background:#071018a8;padding:9px 12px;border-left:2px solid #d6bd77;font-size:13px;color:#dce9ef}</style></head><body>
<div id="veil"><div><h1>ST. AURELIUS CHAPEL</h1><p>A small sanctuary in stone, timber, colored light, and candle glow.<br>Drag to orbit · Scroll to approach</p><button id="enter">Enter Chapel &amp; Play Choir</button></div></div><div id="note">Interactive 3D chapel · click and drag to orbit</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x071018);scene.fog=new THREE.Fog(0x071018,25,85);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,200);camera.position.set(17,11,22);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.target.set(0,5,0);controls.enableDamping=true;controls.dampingFactor=.055;controls.minDistance=8;controls.maxDistance=43;
scene.add(new THREE.HemisphereLight(0x8db8d7,0x1d120b,1.15));const moon=new THREE.DirectionalLight(0xb9d9ff,1.1);moon.position.set(-15,22,12);moon.castShadow=true;scene.add(moon);
const stone=new THREE.MeshStandardMaterial({color:0x817d72,roughness:.92}), darkStone=new THREE.MeshStandardMaterial({color:0x544f49,roughness:1}),wood=new THREE.MeshStandardMaterial({color:0x3c1e0e,roughness:.8}),roof=new THREE.MeshStandardMaterial({color:0x2e3030,roughness:.82}),gold=new THREE.MeshStandardMaterial({color:0xc9a35b,metalness:.55,roughness:.3}),plaster=new THREE.MeshStandardMaterial({color:0xd5cbb4,roughness:.9});
function box(x,y,z,w,h,d,m=stone){let q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;scene.add(q);return q}function cyl(x,y,z,r,h,m=stone){let q=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;scene.add(q);return q}
// ground, nave, gabled roof
box(0,-.35,0,55,.5,55,new THREE.MeshStandardMaterial({color:0x17211d,roughness:1}));box(0,4,0,11,8,18,stone);box(0,5.2,-9.15,12,6,.45,darkStone);
let roofGeo=new THREE.ConeGeometry(8.2,7,4);let r1=new THREE.Mesh(roofGeo,roof);r1.position.set(0,10.9,0);r1.rotation.y=Math.PI/4;r1.scale.z=1.75;r1.castShadow=true;scene.add(r1);
// timber straps and entrance portal
for(let z=-7;z<=7;z+=3.5){box(-5.62,5,z,.22,8,.28,wood);box(5.62,5,z,.22,8,.28,wood)}box(0,3,-9.7,5.1,6,.75,darkStone);box(-1.18,2.5,-10.12,2.18,4.5,.28,wood);box(1.18,2.5,-10.12,2.18,4.5,.28,wood);box(0,5.1,-10.33,.22,4.3,.2,gold);box(0,6.85,-10.33,2.4,.22,.2,gold);
// bell tower and steeple
box(-3.7,11.2,-6.2,4.4,9,4.4,stone);for(let x of[-4.9,-2.5]) for(let z of[-7.5,-4.9]) cyl(x,13,z,.48,2.2,darkStone);let sp=new THREE.Mesh(new THREE.ConeGeometry(3.4,7,4),roof);sp.position.set(-3.7,18.9,-6.2);sp.rotation.y=Math.PI/4;sp.castShadow=true;scene.add(sp);box(-3.7,23,-6.2,.35,3.5,gold);box(-3.7,24,-6.2,2.3,.35,gold);
// arched stained windows: glow panes + stone arches
function windowAt(x,z,rot,col){let g=new THREE.Group();let glow=new THREE.Mesh(new THREE.PlaneGeometry(1.45,2.7),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.86,side:THREE.DoubleSide}));glow.position.y=5.6;g.add(glow);let arch=new THREE.Mesh(new THREE.TorusGeometry(.73,.15,8,18,Math.PI),darkStone);arch.position.y=6.9;arch.rotation.z=Math.PI;g.add(arch);let sill=new THREE.Mesh(new THREE.BoxGeometry(1.7,.22,.16),darkStone);sill.position.y=4.25;g.add(sill);g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);let l=new THREE.PointLight(col,1.1,9);l.position.set(x+(rot?-.7:0),5.6,z+(rot?.3:-.7));scene.add(l)}
windowAt(-5.57,-3,Math.PI/2,0x3d74d8);windowAt(5.57,-3,-Math.PI/2,0xd84a55);windowAt(-5.57,3,Math.PI/2,0x9a55cf);windowAt(5.57,3,-Math.PI/2,0x43a870);windowAt(-5.57,8,Math.PI/2,0xd6a33b);windowAt(5.57,8,-Math.PI/2,0x326fc8);
// altar, crucifix, candles visible through a cutaway-like open front
box(0,2.2,6.6,5.6,1.3,1.55,plaster);box(0,3.25,7.2,.22,4.3,gold);box(0,4.65,7.2,2.3,.22,gold);for(let x of[-2.05,2.05]){cyl(x,3.15,6.35,.16,1.1,new THREE.MeshStandardMaterial({color:0xf2e1a2,emissive:0x8e5616}));let flame=new THREE.PointLight(0xffae55,1.6,7);flame.position.set(x,4,6.35);scene.add(flame)}let warm=new THREE.PointLight(0xffb45c,2.1,16);warm.position.set(0,7,4);scene.add(warm);
// path and tiny crosses
for(let z=-23;z<-10;z+=2)box(0,.02,z,3.3,.08,1.25,new THREE.MeshStandardMaterial({color:0x625b52,roughness:1}));
function stars(){let a=[];for(let i=0;i<260;i++){a.push((Math.random()-.5)*110,Math.random()*42+2,(Math.random()-.5)*110)}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xddeeff,size:.18})))}stars();
// choir: interaction-gated, chord loop with detuned voices/vibrato/filter/reverb
let audioStarted=false;function choir(){if(audioStarted)return;audioStarted=true;const C=new (window.AudioContext||window.webkitAudioContext)(),master=C.createGain(),filter=C.createBiquadFilter(),conv=C.createConvolver();master.gain.value=.19;filter.type='lowpass';filter.frequency.value=1450;const len=C.sampleRate*3.5,imp=C.createBuffer(2,len,C.sampleRate);for(let c=0;c<2;c++){let d=imp.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.7)}conv.buffer=imp;master.connect(filter);filter.connect(conv);conv.connect(C.destination);filter.connect(C.destination);const chords=[[130.81,164.81,196,261.63],[110,130.81,164.81,220],[146.83,174.61,220,293.66],[130.81,155.56,196,261.63]];let step=0;function play(){let now=C.currentTime,notes=chords[step++%chords.length];notes.forEach((f,i)=>{let o=C.createOscillator(),v=C.createOscillator(),vg=C.createGain(),g=C.createGain();o.type=i%2?'sine':'triangle';o.frequency.value=f;v.frequency.value=.18+i*.035;vg.gain.value=3.2;v.connect(vg);vg.connect(o.frequency);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.055,now+2.2);g.gain.linearRampToValueAtTime(.0001,now+7.8);o.connect(g);g.connect(master);o.start(now);o.stop(now+8)});setTimeout(play,5700)}play()}document.getElementById('enter').onclick=()=>{choir();document.getElementById('veil').style.display='none'};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
</script></body></html>
